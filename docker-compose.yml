services:
  postgres:
    image: postgres:16
    container_name: awwaz-postgres
    environment:
      POSTGRES_USER: awwaz
      POSTGRES_PASSWORD: awwaz
      POSTGRES_DB: awwaz
    ports:
      - "5432:5432"
    volumes:
      - awwaz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awwaz -d awwaz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  awwaz-pgdata:
